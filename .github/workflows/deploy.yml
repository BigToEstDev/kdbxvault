name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  # After a release is published - by hand: gh workflow run deploy.yml (pass-docs: docs/dev/release-setup.md)
  workflow_dispatch:
  # Once a day - the releases and the downloads of the app (GitHub at build time); 03:00 UTC
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_GITHUB_APP_URL: ${{ vars.PUBLIC_GITHUB_APP_URL }}
          PUBLIC_GITHUB_CORE_URL: ${{ vars.PUBLIC_GITHUB_CORE_URL }}
          PUBLIC_OBTAINIUM_URL: ${{ vars.PUBLIC_OBTAINIUM_URL }}
          PUBLIC_BOOSTY_URL: ${{ vars.PUBLIC_BOOSTY_URL }}
          GH_API_URL: ${{ vars.GH_API_URL }}
          GH_RAW_URL: ${{ vars.GH_RAW_URL }}
          # The token of the run - the GitHub API without the limit of 60 requests an hour
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
